[package]
name = "plugin_typescript"
version = "0.1.0"
edition = "2021"
description = "TypeScript as a scripting language: one Language registration (extensions, the class.ts marker, the compiler, typescript-language-server: discovery, a pinned managed install, tsconfig, live compiler diagnostics) that compiles src/classes/<Class>/class.ts to engine script modules (pulsar_script_ts, in ./compiler). It has no editor; code editing is the code editor's job."

[dependencies]
engine_fs = { workspace = true }
# The compiler: the TypeScript subset to engine script modules (oxc, lowering).
pulsar_script_ts = { workspace = true }
# Where compiled modules go: the project's module store, keyed by class id.
pulsar_class = { workspace = true }
plugin_editor_api = { workspace = true }
# The registration types: Language, the server spec, the script compiler trait.
pulsar_language = { workspace = true }
pulsar_plugins = { workspace = true }
# The plugin's own setting (compiler diagnostics on/off), through the plugin-settings handle.
pulsar_settings = { workspace = true }
pulsar-config = { workspace = true }
# The engine's tools directory: where the approved managed install goes.
pulsar_install_layout = { workspace = true }
# The managed install verifies a pinned digest, then unpacks the npm tarballs.
sha2 = { workspace = true }
flate2 = "1"
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The server and its service, driven over a scripted pipe (no Node).
pulsar_lsp = { workspace = true }
gpui-ce = { workspace = true, features = ["test-support"] }
ui = { workspace = true }
tempfile = { workspace = true }
pulsar_script_vm = { workspace = true }
pulsar_script_math = { workspace = true }

[lints]
workspace = true
